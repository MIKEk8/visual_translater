[package]
name = "screen-translator-minimal"
version = "3.0.0"
edition = "2021"
authors = ["Screen Translator Team"]
description = "Minimal demo of screen translator architecture"

[[bin]]
name = "main_minimal"
path = "src/main_minimal.rs"

[dependencies]
# Core functionality only
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Image processing (lightweight)
image = { version = "0.24", default-features = false, features = ["png"] }

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
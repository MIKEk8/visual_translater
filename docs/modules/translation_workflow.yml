module: src/core/coordinators/translation_workflow.py
purpose: Orchestrates the complete translation workflow from screenshot to result
interfaces:
  - "execute_workflow(request: TranslationRequest) -> TranslationResult"
  - "set_ocr_engine(engine: OCREngine) -> None"
  - "set_translation_engine(engine: TranslationEngine) -> None"
  - "get_workflow_status() -> WorkflowStatus"
dependencies:
  uses: [core/ocr_engine, core/translation_engine, services/cache_service]
  used_by: [coordinators/application_controller, api/routes]
tests:
  unit: [src/tests/unit/core/coordinators/test_translation_workflow.py]
  integration: [src/tests/integration/test_core_workflow.py]
constraints:
  invariants: [valid request format, engines configured]
  perf_budget: <5s end-to-end workflow

module: src/core/ocr_engine.py
purpose: OCR text extraction engine with multiple backend support
interfaces:
  - "extract_text(image: Image) -> str"
  - "set_language(lang: str) -> None"
  - "get_supported_languages() -> List[str]"
  - "configure(config: OCRConfig) -> None"
dependencies:
  uses: [pytesseract, ai_ocr_engine]
  used_by: [coordinators/capture_orchestrator, services/ocr_service]
tests:
  unit: []
  integration: [src/tests/integration/test_core_workflow.py]
constraints:
  invariants: [valid image input, non-empty language code]
  perf_budget: <3s per image extraction

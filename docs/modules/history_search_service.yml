module: src/services/history_search_service.py
purpose: Enhanced SQLite FTS5 full-text search service for translation history
interfaces:
  - async search(query: str, filters: SearchFilters, limit: int, offset: int) -> SearchResult
  - async get_search_suggestions(partial_query: str, limit: int) -> List[str]
  - async get_search_statistics() -> Dict[str, Any]
  - migrate_existing_data() -> bool
dependencies:
  uses: [circuit_breaker, sqlite3, domain/entities/translation]
  used_by: [ui/history_window, api/routes]
tests:
  unit: [tests/unit/services/test_history_search_service.py]
  integration: [tests/integration/test_enhanced_features_integration.py]
constraints:
  invariants: [FTS5 enabled for performance, secure query sanitization, circuit breaker protection]
  perf_budget: <100ms for basic search, <500ms for complex filtering

module: src/ui/quick_actions_menu.py
purpose: Floating context menu providing quick access to common translation operations
interfaces:
  - show_menu(x: int, y: int, actions: List[MenuAction]) -> None
  - hide_menu() -> None
  - add_action(action: MenuAction) -> None
  - set_position(x: int, y: int, anchor: str) -> None
dependencies:
  uses: [tkinter, circuit_breaker, action_callbacks]
  used_by: [translation_overlay, ui_coordinator]
tests:
  unit: [tests/unit/ui/test_quick_actions_menu.py]
  integration: [tests/integration/test_enhanced_features_integration.py]
constraints:
  invariants: [always on top, proper z-order, action validation, timeout handling]
  perf_budget: <100ms menu display, <50ms action execution

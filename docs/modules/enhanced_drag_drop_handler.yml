module: src/ui/enhanced_drag_drop_handler.py
purpose: Enhanced drag and drop support for files, URLs, and clipboard content
interfaces:
  - register_drop_target(widget: tk.Widget, file_types: List[str]) -> None
  - handle_file_drop(files: List[str]) -> None
  - handle_url_drop(url: str) -> None
  - validate_drop_content(content: Any) -> bool
dependencies:
  uses: [tkinter, tkinterdnd2, file_validators, circuit_breaker]
  used_by: [main_window, settings_window, translation_overlay]
tests:
  unit: [tests/unit/ui/test_enhanced_drag_drop.py]
  integration: [tests/integration/test_enhanced_features_integration.py]
constraints:
  invariants: [file type validation, size limits enforced, security scanning, error handling]
  perf_budget: <200ms file validation, <1MB memory per file

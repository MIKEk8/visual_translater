module: screen-translator-rust/src/core/screenshot.rs
purpose: Cross-platform screenshot capture with area selection and monitor enumeration
interfaces:
  - ScreenshotCapture::initialize(&mut self) -> Result<()>
  - ScreenshotCapture::capture_area(&self, area: CaptureArea) -> Result<DynamicImage>
  - ScreenshotCapture::capture_fullscreen(&self, monitor_id: Option<u32>) -> Result<DynamicImage>
  - ScreenshotCapture::get_monitors(&self) -> Result<Vec<MonitorInfo>>
  - ScreenshotCapture::is_available(&self) -> bool
  - ScreenshotCapture::validate_area(&self, area: &CaptureArea) -> Result<()>
dependencies:
  uses: [image, screenshots, serde, thiserror, log]
  used_by: [rust_ocr_engine, rust_image_processor, rust_main_app]
tests:
  unit: [tests/test_screenshot.rs]
  integration: [tests/integration_ocr.rs]
constraints:
  invariants: [valid area coordinates, monitor bounds checking, proper error handling]
  perf_budget: "< 2s screenshot capture, < 500ms monitor enumeration"
security:
  considerations: [screen capture permissions, coordinate validation, memory bounds]

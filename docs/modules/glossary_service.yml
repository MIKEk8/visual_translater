module: src/services/glossary_service.py
purpose: Game-specific translation glossary management with context-aware term replacement
interfaces:
  - async apply_glossary(text: str, translation: str) -> str
  - async create_glossary(name: str, description: str, language_pair: Tuple[str, str]) -> Glossary
  - async add_term_to_glossary(glossary_name: str, source_term: str, target_term: str) -> bool
  - async search_terms(query: str, glossary_name: str, category: str) -> List[GlossaryTerm]
dependencies:
  uses: [circuit_breaker, json_persistence, regex_compilation]
  used_by: [translation_workflow, ui/settings_window]
tests:
  unit: [tests/unit/services/test_glossary_service.py]
  integration: [tests/integration/test_enhanced_features_integration.py]
constraints:
  invariants: [compiled pattern caching, term priority ordering, usage statistics tracking]
  perf_budget: <50ms term application, <100ms search operations
last_updated: 2025-09-26
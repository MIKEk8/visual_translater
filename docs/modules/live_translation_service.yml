module: src/services/live_translation_service.py
purpose: Continuous screen monitoring with automatic translation on content changes
interfaces:
  - async start_monitoring(region: CaptureRegion) -> None
  - async stop_monitoring() -> None
  - async set_change_threshold(threshold: float) -> None
  - async get_monitoring_status() -> MonitoringStatus
dependencies:
  uses: [screen_capture_service, ocr_engine, translation_engine, circuit_breaker]
  used_by: [ui/live_translation_window, core/application]
tests:
  unit: [tests/unit/services/test_live_translation_service.py]
  integration: [tests/integration/test_enhanced_features_integration.py]
constraints:
  invariants: [change detection accuracy >95%, resource usage monitoring, graceful degradation]
  perf_budget: <500ms capture cycle, <2% CPU usage idle

module: src/application/services/screenshot_processor_refactored.py
purpose: Processes and validates screenshots for OCR and translation workflow
interfaces:
  - "process_screenshot(screenshot: Screenshot) -> ProcessedScreenshot"
  - "validate_screenshot(image: Image) -> ValidationResult"
  - "extract_text_regions(screenshot: Screenshot) -> List[TextRegion]"
dependencies:
  uses: [domain/entities/screenshot, ai/smart_area_detection]
  used_by: [coordinators/capture_orchestrator, use_cases/translation_use_cases]
tests:
  unit: []
  integration: [src/tests/integration/test_main_scenarios.py]
constraints:
  invariants: [valid image format, non-zero dimensions]
  perf_budget: <500ms per screenshot processing

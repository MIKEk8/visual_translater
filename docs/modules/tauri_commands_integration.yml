module: screen-translator-rust/src/commands/mod.rs
purpose: Complete Tauri command API layer for React-Rust communication with type safety
interfaces:
  - translate_text(request: TranslationRequest) -> Result<TranslationResult>
  - capture_screenshot(area: Option<CaptureArea>) -> Result<String>
  - perform_ocr(image_data: String) -> Result<OcrResult>
  - get_app_config() -> Result<AppConfig>
  - set_app_config(config: AppConfig) -> Result<()>
  - get_translation_history() -> Result<Vec<HistoryEntry>>
  - initialize_hotkeys() -> Result<()>
dependencies:
  uses: [tauri::command, serde, core modules, services, types]
  used_by: [React frontend, main.rs]
tests:
  unit: [src/commands/tests.rs]
  integration: [via React frontend calls]
constraints:
  invariants: [async/await pattern, Result<T, String> returns, JSON serialization]
  perf_budget: "< 100ms command dispatch, < 1s complex operations"
security:
  considerations: [input validation, command allowlist, CSP compliance]
